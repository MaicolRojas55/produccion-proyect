<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#122135" />
    </linearGradient>
    <linearGradient id="stageGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#0ea5a4" stop-opacity="0.12" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Back wall / auditorium frame -->
  <rect x="60" y="80" width="1280" height="660" rx="16" fill="#071026" opacity="0.6" />

  <!-- Stage area -->
  <g transform="translate(140,160)">
    <rect x="0" y="360" width="1120" height="180" rx="12" fill="#0f1724" />
    <!-- stage lights glow -->
    <rect x="0" y="340" width="1120" height="40" fill="url(#stageGlow)" />

    <!-- Podium and speaker silhouette -->
    <g transform="translate(520,260)">
      <rect x="-60" y="40" width="120" height="10" rx="3" fill="#0b1220" opacity="0.6" />
      <rect x="-40" y="0" width="80" height="120" rx="6" fill="#071124" />
      <circle cx="0" cy="-10" r="20" fill="#0b1220" />
      <rect x="-10" y="20" width="20" height="60" rx="6" fill="#0b1220" />
      <!-- podium -->
      <rect x="-90" y="80" width="180" height="60" rx="6" fill="#111827" />
      <rect x="-30" y="86" width="60" height="6" rx="3" fill="#0ea5a4" />
    </g>

    <!-- Audience rows with silhouettes -->
    <g transform="translate(60,420)">
      <!-- row loop -->
      <g fill="#cbd5e1" opacity="0.95">
        <!-- Row 1 (closest) -->
        <g transform="translate(0,120)">
          <g transform="translate(0,0)">
            <g transform="translate(0,0)">
              <!-- 14 seats -->
              <!-- repeat circles and shoulders -->
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Draw audience using repeated symbols for better clarity -->
  <g fill="#cbd5e1" opacity="0.95">
    <!-- 4 rows, decreasing size -->
    <!-- Row 1 -->
    <g transform="translate(200,520)">
      <g>
        <!-- 12 heads -->
        <g>
          <g transform="translate(0,0)">
            <circle cx="0" cy="0" r="14" />
            <rect x="-16" y="12" width="32" height="12" rx="6" />
          </g>
          <use href="#" />
        </g>
        <!-- repeated heads spaced -->
        <g>
          <!-- create multiple copies -->
          <g transform="translate(0,0)">
            <!-- positions generated via translation list -->
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Title -->
  <text x="120" y="110" fill="#ffffff" font-size="36" font-family="Arial, Helvetica, sans-serif" font-weight="700">Conferencia — Auditorio</text>
</svg>
