name: CD — Deploy Staging

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy frontend staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: staging
      url: https://produccion-proyect-staging.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Instalar y compilar
        working-directory: front-end
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ vars.STAGING_VITE_API_URL || '/api' }}

      - name: Deploy a Azure Web App (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.STAGING_AZURE_WEBAPP_NAME || 'produccion-proyect-staging' }}
          publish-profile: ${{ secrets.STAGING_AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./front-end/dist
