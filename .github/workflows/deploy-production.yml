name: CD — Deploy Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy frontend production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: production
      url: https://produccion-proyect.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Instalar y compilar
        working-directory: front-end
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ vars.PRODUCTION_VITE_API_URL || '/api' }}

      - name: Deploy a Azure Web App (production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: produccion-proyect
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./front-end/dist
