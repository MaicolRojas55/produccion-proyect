name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - desarrollo-rediseño
      - '**'
  pull_request:
    branches:
      - main
      - develop
      - desarrollo-rediseño
      - '**'

jobs:
  lint:
    name: Lint frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-tests:
    name: Tests backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: users-service
          - service: notification-service
          - service: conferences-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      PYTHONPATH: .
      JWT_SECRET_KEY: test-jwt-secret-key-minimum-32-characters-for-ci
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: test_db
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
      LOG_LEVEL: INFO
      NOTIFICATION_MODE: simulado
      SQLITE_PATH: /tmp/notifications-test.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ejecutar pytest
        run: python -m pytest -q --tb=short

  test-frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run test

  build:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [lint, backend-tests, test-frontend]
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: true
